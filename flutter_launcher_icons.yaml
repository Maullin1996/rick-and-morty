# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/icono.png"       # ícono legacy (Android <8, iOS, etc.)
  android: "launcher_icon"
  adaptive_icon_background: "#0B1E1A"          # o una imagen de fondo, ej: "assets/images/icono_fondo.png"
  # adaptive_icon_foreground: "assets/images/icono_foreground.png"  # SOLO Rick y Morty, fondo transparente
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  adaptive_icon_foreground_inset: 20

